sonar.projectKey=petFinderUptc_frontend-petFinder
sonar.organization=petfinderuptc
sonar.projectName=PetFinder Frontend
sonar.projectVersion=1.0

sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.spec.js,**/*.test.js
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/coverage/**,\
  **/src/test/**,\
  **/src/styles/**,\
  **/src/assets/**,\
  **/src/main.jsx,\
  **/src/index.css

sonar.javascript.lcov.reportPaths=coverage/lcov.info

sonar.coverage.exclusions=\
  **/src/pages/**,\
  **/src/components/**,\
  **/src/context/**,\
  **/src/services/**,\
  **/src/layouts/**,\
  **/src/constants/**,\
  **/src/main.jsx,\
  **/src/App.jsx,\
  **/src/AppRouter.jsx

sonar.sourceEncoding=UTF-8
